[bases]
A = "#E8E8E8"
T = "#E8E8E8"
G = "#E8E8E8"
C = "#E8E8E8"
other = "#8A8A8A"

[ui]
selection      = "#3A6EA8CC"
cursor         = "#3278FF"
cut_site       = "#9CA8B8"
label_text     = "#FFFFFF"   # used on dark feature swatches
label_text_alt = "#141414"   # used on light feature swatches (auto-picked via WCAG)
ruler_text     = "#A0A0A0"
mismatch       = "#EB9B28"   # amber accent for a primer's mismatched bases
hover_wash     = "#969BA540"  # neutral wash over hovered elements
danger         = "#B03030"     # destructive action fill
danger_hover   = "#E06060"     # danger button hover
warn           = "#E0A030"     # warning indicators
error          = "#E06060"     # error text
methyl_blocked = "#808080"     # methylated/blocked enzyme text
selected_outline = "#FFFFFF"   # outline on the selected feature / primer

[diff]
add_bg   = "#28784B46"
del_bg   = "#782D2B46"
del_line = "#D65C5C"

[features]
gene       = "#6495ED"
cds        = "#48C9B0"
promoter   = "#F1C40F"
terminator = "#E74C3C"
rep        = "#9B59B6"
source     = "#95A5A6"
misc       = "#BDC3C7"
other      = "#BDC3C7"

# Keys are matched against the verbatim GenBank feature type first (so
# `misc_difference` can differ from `misc_feature`), then against the coarse
# kind bucket above. Add any GenBank type name here.
misc_difference = "#E8B33A"
misc_binding    = "#8FA6B8"
primer_bind     = "#C78FD6"
enhancer        = "#5DADE2"
polya_signal    = "#D98880"
protein_bind    = "#7FB3A3"
sig_peptide     = "#A3B86C"
mat_peptide     = "#C9A227"
repeat_region   = "#99857A"
intron          = "#6C7A89"
exon            = "#4FA3D1"
trna            = "#D4A5C8"
rrna            = "#C8A5D4"
ncrna           = "#A5C8D4"
stem_loop       = "#8E9BA8"

[strand]
forward = "#FFBE006E"
reverse = "#00BEFF6E"
unknown = "#C8C8C85A"

[minimap]
viewport  = "#FFFFFF1C"
selection = "#ADD6FF5A"
cursor    = "#FFFFFF"

[translation]
stop     = "#D24646"
start    = "#46AF5A"
orf_wash = "#5AAF6A1A"

# App chrome (panels, windows, widget text). `dark` picks egui's stock dark or
# light base; each colour overrides it.
[chrome]
dark    = true
panel   = "#1B1B1B"
window  = "#1B1B1B"
extreme = "#0A0A0A"   # text fields, scroll troughs
text    = "#8C8C8C"   # labels / non-interactive text
stroke  = "#3C3C3C"   # separators, window outlines
